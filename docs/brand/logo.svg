<?xml version="1.0" encoding="UTF-8"?>
<!-- Primary mark: the device face in its gold pose.
     Geometry mirrors the firmware — corner radius 76/480 of the panel
     edge, nav dot at 25% width (rust, the family tie to esp-harness),
     centre-bracketed breathing ring (ui_deco), segment baseline.
     One mark for light and dark contexts; the panel is always noir. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="esp32-agent-dashboard logo">
  <title>esp32-agent-dashboard</title>
  <rect x="8" y="8" width="104" height="104" rx="16.5" fill="#0b0a09"/>
  <rect x="8.75" y="8.75" width="102.5" height="102.5" rx="16" fill="none"
        stroke="#f3eee2" stroke-opacity="0.12" stroke-width="1.5"/>
  <!-- nav dot (25% width) -->
  <circle cx="34" cy="21" r="2.4" fill="#cc4a1e"/>
  <!-- corner brackets -->
  <g stroke="#5a514a" stroke-width="2" fill="none">
    <path d="M 24 32 h -4 v 8"/>
    <path d="M 96 32 h 4 v 8"/>
    <path d="M 24 88 h -4 v -8"/>
    <path d="M 96 88 h 4 v -8"/>
  </g>
  <!-- clamp brackets + breathing ring, gold -->
  <g stroke="#4a453f" stroke-width="2.4" fill="none">
    <path d="M 41 48 h -5 v 20 h 5"/>
    <path d="M 79 48 h 5 v 20 h -5"/>
  </g>
  <circle cx="60" cy="58" r="13.5" fill="none" stroke="#d9a92f" stroke-width="3.4"/>
  <circle cx="60" cy="58" r="5" fill="#d9a92f"/>
  <!-- segment baseline -->
  <g fill="#6a6058">
    <rect x="34" y="94" width="12" height="3"/>
    <rect x="49" y="94" width="5" height="3"/>
    <rect x="57" y="94" width="14" height="3"/>
    <rect x="76" y="94" width="3" height="3"/>
    <rect x="82" y="94" width="3" height="3"/>
  </g>
</svg>
