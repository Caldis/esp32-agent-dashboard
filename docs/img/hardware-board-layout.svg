<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-label="Waveshare ESP32-S3-Touch-AMOLED-2.16 board layout">
  <title>Waveshare ESP32-S3-Touch-AMOLED-2.16 button + port layout</title>
  <desc>Labelled diagram of the Waveshare ESP32-S3-Touch-AMOLED-2.16 board showing the 466x466 round AMOLED, BOOT button (approve), USER button (deny), USB-C port, and battery connector.</desc>

  <!-- background -->
  <rect width="720" height="480" fill="#0e0e10"/>

  <!-- title -->
  <text x="360" y="36" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,monospace" font-size="18"
        fill="#d4cdc1" letter-spacing="0.6">
    Waveshare ESP32-S3-Touch-AMOLED-2.16
  </text>

  <!-- PCB body -->
  <rect x="160" y="80" width="400" height="340" rx="22" ry="22"
        fill="#1c1814" stroke="#3a2f24" stroke-width="2"/>

  <!-- AMOLED ring -->
  <circle cx="360" cy="250" r="138" fill="#0a0a0c" stroke="#b8431a" stroke-width="3"/>
  <circle cx="360" cy="250" r="128" fill="#181818" stroke="#2a2a2e" stroke-width="1"/>

  <!-- display content sketch -->
  <text x="360" y="222" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,monospace" font-size="13"
        fill="#9aa099">claude-code · cc_abc</text>
  <text x="360" y="246" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,monospace" font-size="11"
        fill="#5f6661">running · D:\Code\firmware</text>
  <rect x="270" y="262" width="180" height="3" rx="1.5" fill="#b8431a"/>
  <text x="360" y="288" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,monospace" font-size="10"
        fill="#6a7068">10:42  Bash    git diff</text>
  <text x="360" y="304" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,monospace" font-size="10"
        fill="#6a7068">10:41  Edit    main.c (+8 -2)</text>
  <text x="360" y="320" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,monospace" font-size="10"
        fill="#6a7068">10:39  Read    main.c</text>

  <text x="360" y="370" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,monospace" font-size="9"
        fill="#3a3f3a">466 × 466 AMOLED · LVGL 9</text>

  <!-- BOOT button -->
  <rect x="184" y="226" width="34" height="44" rx="4" ry="4"
        fill="#2a221a" stroke="#b8431a" stroke-width="2"/>
  <circle cx="201" cy="248" r="9" fill="#b8431a"/>
  <text x="201" y="252" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="9"
        fill="#0e0e10" font-weight="700">BOOT</text>

  <!-- arrow + label: BOOT -->
  <line x1="184" y1="248" x2="120" y2="180" stroke="#b8431a" stroke-width="1.5"/>
  <circle cx="184" cy="248" r="2.5" fill="#b8431a"/>
  <text x="60" y="170" font-family="ui-monospace,SFMono-Regular,monospace"
        font-size="13" fill="#d4cdc1" font-weight="700">BOOT</text>
  <text x="60" y="188" font-family="ui-monospace,SFMono-Regular,monospace"
        font-size="10" fill="#9aa099">= approve once</text>

  <!-- USER button -->
  <rect x="502" y="226" width="34" height="44" rx="4" ry="4"
        fill="#1a1d1e" stroke="#344a36" stroke-width="2"/>
  <circle cx="519" cy="248" r="9" fill="#344a36"/>
  <text x="519" y="252" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,sans-serif" font-size="9"
        fill="#d4cdc1" font-weight="700">USR</text>

  <!-- arrow + label: USER -->
  <line x1="536" y1="248" x2="608" y2="180" stroke="#344a36" stroke-width="1.5"/>
  <circle cx="536" cy="248" r="2.5" fill="#344a36"/>
  <text x="608" y="170" text-anchor="end"
        font-family="ui-monospace,SFMono-Regular,monospace"
        font-size="13" fill="#d4cdc1" font-weight="700">USER</text>
  <text x="608" y="188" text-anchor="end"
        font-family="ui-monospace,SFMono-Regular,monospace"
        font-size="10" fill="#9aa099">= deny</text>

  <!-- USB-C port (top edge) -->
  <rect x="320" y="76" width="80" height="14" rx="3" ry="3"
        fill="#2a2a2e" stroke="#4a4a4e" stroke-width="1"/>
  <rect x="334" y="80" width="52" height="6" rx="2" ry="2" fill="#0a0a0c"/>
  <line x1="360" y1="76" x2="360" y2="48" stroke="#9aa099" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="360" y="42" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,monospace" font-size="11"
        fill="#9aa099">USB-C  (flash + serial)</text>

  <!-- Battery JST (bottom edge) -->
  <rect x="306" y="412" width="50" height="10" rx="2" ry="2"
        fill="#2a2a2e" stroke="#4a4a4e" stroke-width="1"/>
  <line x1="331" y1="422" x2="331" y2="450" stroke="#9aa099" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="331" y="464" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,monospace" font-size="10"
        fill="#9aa099">JST 1.25mm · 3.7V LiPo (optional)</text>

  <!-- Reset hint (bottom-left silkscreen) -->
  <rect x="372" y="412" width="40" height="10" rx="2" ry="2"
        fill="#2a2a2e" stroke="#4a4a4e" stroke-width="1"/>
  <text x="392" y="420" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,monospace" font-size="7"
        fill="#9aa099">RST</text>
  <line x1="392" y1="422" x2="430" y2="450" stroke="#9aa099" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="438" y="464" text-anchor="start"
        font-family="ui-monospace,SFMono-Regular,monospace" font-size="10"
        fill="#9aa099">RST</text>

  <!-- footer -->
  <text x="360" y="452" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,monospace" font-size="9"
        fill="#3a3f3a">stylised, not to scale · see Waveshare wiki for the authoritative pinout</text>
</svg>
