# Deploy the homepage + simulator (docs/) to GitHub Pages.
#
# Why a workflow instead of the legacy branch build: the legacy Jekyll
# pipeline failed on every push from Jul 28 onward (serving a May-era
# site), and after .nojekyll it started hanging in "building" for 40+
# minutes on a 2.6 MB repo. This uploads docs/ verbatim — deterministic
# and done in under a minute.
name: pages

on:
  push:
    branches: [master]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
